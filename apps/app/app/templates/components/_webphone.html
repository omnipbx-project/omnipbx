<div class="webphone-dock" id="webphone-dock" hidden>
  <div class="webphone-panel" id="webphone-panel" data-detached="false">
    <div class="webphone-picker" id="webphone-picker" hidden>
      <select id="webphone-extension" aria-label="Webphone extension"></select>
    </div>

    <div class="webphone-number-row">
      <input id="webphone-number" inputmode="tel" autocomplete="off" placeholder="Enter name or number" aria-label="Dial number">
      <button type="button" class="webphone-back" id="webphone-backspace" title="Backspace" aria-label="Backspace">⌫</button>
    </div>

    <div class="webphone-keypad" id="webphone-keypad">
      {% for key in ["1", "2", "3", "4", "5", "6", "7", "8", "9", "*", "0", "#"] %}
      <button type="button" data-key="{{ key }}">{{ key }}</button>
      {% endfor %}
      <button type="button" id="webphone-transfer">R</button>
      <button type="button" data-key="+">+</button>
      <button type="button" id="webphone-clear">C</button>
    </div>

    <div class="webphone-call-row">
      <button type="button" class="webphone-icon-btn" id="webphone-video" title="Video call" aria-label="Video call">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M17 10.5V6c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v12c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-4.5l4 4v-11l-4 4z"/>
        </svg>
      </button>
      <button type="button" class="webphone-call" id="webphone-call">Call</button>
    </div>

    <div class="webphone-toggle-row">
      <button type="button" id="webphone-dnd">DND</button>
      <button type="button" id="webphone-auto-answer">Auto Ans</button>
    </div>

    <a class="webphone-download" href="/softphone/extension/download" download title="Download browser extension">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/>
      </svg>
      <span>Download extension</span>
    </a>

    <div class="webphone-status">
      <span class="webphone-dot" id="webphone-dot"></span>
      <span id="webphone-status">Loading...</span>
      <span id="webphone-account">Not ready</span>
    </div>

    <button type="button" class="webphone-settings" id="webphone-settings" title="Open separate webphone window" aria-label="Open separate webphone window">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M19.43 12.98c.04-.32.07-.65.07-.98s-.02-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.37-.31-.6-.22l-2.49 1a7.28 7.28 0 0 0-1.69-.98L14.5 2.42C14.47 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.5.42L9.12 5.07c-.61.24-1.18.56-1.69.98l-2.49-1c-.23-.08-.48 0-.6.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.08.65-.08.98s.03.66.08.98l-2.11 1.65c-.19.15-.25.42-.12.64l2 3.46c.12.22.37.31.6.22l2.49-1c.51.4 1.08.73 1.69.98l.38 2.65c.04.24.25.42.5.42h4c.25 0 .47-.18.5-.42l.38-2.65c.61-.25 1.18-.58 1.69-.98l2.49 1c.23.09.48 0 .6-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5A3.5 3.5 0 1 1 12 8a3.5 3.5 0 0 1 0 7.5z"/>
      </svg>
    </button>

    <div class="webphone-video-box" id="webphone-video-box" hidden>
      <video id="webphone-remote-video" autoplay playsinline></video>
      <video id="webphone-local-video" autoplay playsinline muted></video>
    </div>

    <div class="webphone-hidden-controls" aria-hidden="true">
      <button type="button" id="webphone-copy" tabindex="-1">Copy</button>
      <button type="button" id="webphone-attach" tabindex="-1">Attach</button>
      <button type="button" id="webphone-detach" tabindex="-1">Detach</button>
      <button type="button" id="webphone-close" tabindex="-1">Close</button>
      <button type="button" id="webphone-hangup" tabindex="-1">Hang up</button>
      <button type="button" id="webphone-mute" tabindex="-1">Mic</button>
      <button type="button" id="webphone-speaker" tabindex="-1">Sound</button>
      <button type="button" id="webphone-hold" tabindex="-1">Hold</button>
      <input id="webphone-volume" type="range" min="0" max="1" step="0.05" value="1" tabindex="-1">
    </div>

    <ol class="webphone-log" id="webphone-log"></ol>
    <audio id="webphone-remote-audio" autoplay></audio>
  </div>
</div>
