<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Floating Web Softphone</title>
  <link rel="stylesheet" href="softphone.css" />
</head>
<body class="floating-body">
  <main class="phone-shell compact" data-mode="floating">
    <div class="tabs compact-tabs solo-menu" aria-label="Softphone menu">
      <span class="top-spacer"></span>
      <button class="menu-btn" id="settingsToggle" type="button" title="Account settings">▾</button>
    </div>

    <section class="settings-panel" id="settingsPanel" aria-label="SIP account settings">
      <label>WSS URL <input id="wsUrl" autocomplete="off" placeholder="wss://pbx.example.com:8089/ws" /></label>
      <label>SIP domain <input id="sipDomain" autocomplete="off" placeholder="pbx.example.com" /></label>
      <div class="settings-grid">
        <label>Ext <input id="sipUser" autocomplete="username" placeholder="1001" /></label>
        <label>Auth <input id="authUser" autocomplete="off" placeholder="Optional" /></label>
      </div>
      <label>Password <input id="sipPass" type="password" autocomplete="current-password" placeholder="SIP password" /></label>
      <label>Display <input id="displayName" autocomplete="off" placeholder="1001" /></label>
      <div class="settings-actions">
        <button id="registerBtn" type="button">Register</button>
        <button id="unregisterBtn" type="button">Unregister</button>
      </div>
    </section>

    <section class="phone-view" id="phoneView">
      <div class="number-row">
        <input id="dialNumber" class="dial-input" inputmode="tel" autocomplete="off" aria-label="Dial number" />
        <button id="copyNumberBtn" class="mini-square" type="button" title="Copy number">⧉</button>
      </div>
      <div class="keypad small-keypad" aria-label="Dial keypad">
        <button type="button" data-key="1"><span>1</span></button>
        <button type="button" data-key="2"><span>2</span><small>ABC</small></button>
        <button type="button" data-key="3"><span>3</span><small>DEF</small></button>
        <button type="button" data-key="4"><span>4</span><small>GHI</small></button>
        <button type="button" data-key="5"><span>5</span><small>JKL</small></button>
        <button type="button" data-key="6"><span>6</span><small>MNO</small></button>
        <button type="button" data-key="7"><span>7</span><small>PQRS</small></button>
        <button type="button" data-key="8"><span>8</span><small>TUV</small></button>
        <button type="button" data-key="9"><span>9</span><small>WXYZ</small></button>
        <button type="button" data-key="*"><span>*</span></button>
        <button type="button" data-key="0"><span>0</span></button>
        <button type="button" data-key="#"><span>#</span></button>
      </div>
      <div class="utility-row">
        <button id="transferBtn" type="button">R</button>
        <button id="plusBtn" type="button">+</button>
        <button id="clearBtn" type="button">C</button>
      </div>
      <div class="call-row">
        <button id="videoCallBtn" class="icon-call" type="button">▣</button>
        <button id="callBtn" class="main-call" type="button">Call</button>
        <button id="messageBtn" class="icon-call" type="button">▱</button>
      </div>
      <div class="level-row"><button id="speakerMuteBtn" class="level-icon" type="button">🔈</button><span>−</span><input id="speakerVolume" type="range" min="0" max="1" step="0.05" value="1" /><span>+</span></div>
      <div class="level-row"><button id="micMuteBtn" class="level-icon" type="button">🎙</button><span>−</span><input id="micGain" type="range" min="0" max="1" step="0.05" value="1" disabled /><span>+</span></div>
      <div class="feature-row">
        <button id="dndBtn" type="button" data-toggle="false">DND</button>
        <button id="autoAnswerBtn" type="button" data-toggle="false">Auto Ans</button>
        <button id="confBtn" type="button" data-toggle="false">CONF</button>
      </div>
      <section class="media-panel" id="mediaPanel"><video id="remoteVideo" autoplay playsinline></video><video id="localVideo" autoplay playsinline muted></video><audio id="remoteAudio" autoplay></audio></section>
      <section class="log-panel" id="logPanel" hidden><div class="log-title">Call log</div><ol id="callLog"></ol></section>
    </section>

    <footer class="statusbar"><span id="statusDot" class="status-dot"></span><span id="statusText">Not registered</span><span id="accountLabel">—</span></footer>
  </main>
  <script src="jssip.min.js"></script>
  <script src="softphone.js"></script>
</body>
</html>
